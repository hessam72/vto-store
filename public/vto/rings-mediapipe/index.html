<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان انگشتر - MediaPipe</title>

  <!-- Import Three.js -->
  <script src="./libs/three/v136/build/three.js"></script>
  <script src="./libs/three/v136/examples/js/loaders/GLTFLoader.js"></script>
  <script src="./libs/three/v136/examples/js/loaders/RGBELoader.js"></script>

  <!-- MediaPipe Tasks Vision via CDN -->
  <script type="importmap">
  {
    "imports": {
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs"
    }
  }
  </script>

  <!-- Shared VTO UI Styles -->
  <link rel="stylesheet" href="../shared/vto-ui.css">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
    }

    #videoElement {
      display: none;
    }

    #canvasElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #VTOCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: white;
      font-size: 20px;
      transition: opacity 0.5s;
    }

    #instructions {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      z-index: 50;
      max-width: 400px;
      transition: opacity 0.5s;
    }

    #instructions h2 {
      margin-top: 0;
      color: #ffd700;
    }

    #changeCamera {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      padding: 15px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    #changeCamera:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Hidden video element for webcam -->
  <video id="videoElement" autoplay playsinline></video>

  <!-- Canvas for video + MediaPipe visualization -->
  <canvas id="canvasElement"></canvas>

  <!-- Canvas for Three.js 3D rendering -->
  <canvas id="VTOCanvas"></canvas>

  <!-- Loading screen -->
  <div id="loading">
    <div>
      <div class="spinner"></div>
      <p>در حال بارگذاری...</p>
      <p style="font-size: 14px; opacity: 0.7;">MediaPipe Hand Tracking</p>
    </div>
  </div>

  <!-- Instructions -->
  <div id="instructions">
    <h2>📱 راهنمای استفاده</h2>
    <p>دست خود را در مقابل دوربین قرار دهید</p>
    <p>انگشتر روی انگشت حلقه شما نمایش داده می‌شود</p>
    <p style="font-size: 14px; opacity: 0.8; margin-top: 15px;">
      برای بهترین نتیجه، دست خود را در فاصله 30-50 سانتی‌متری دوربین نگه دارید
    </p>
  </div>

  <!-- Camera switch button -->
  <button id="changeCamera">🔄 تغییر دوربین</button>

  <!-- Core modules - loaded after THREE.js is available -->
  <script type="module">
    console.log('🔍 Checking for THREE.js...');

    // Wait for THREE to be defined
    function checkTHREE() {
      if (typeof THREE !== 'undefined') {
        // THREE is loaded, now load our modules
        console.log('✅ THREE.js detected, loading main.js...');
        import('./main.js').then(() => {
          console.log('✅ main.js module loaded');
        }).catch(err => {
          console.error('❌ Failed to load main.js:', err);
        });
      } else {
        // Wait and try again
        console.log('⏳ Waiting for THREE.js...');
        setTimeout(checkTHREE, 50);
      }
    }
    checkTHREE();
  </script>
</body>
</html>
