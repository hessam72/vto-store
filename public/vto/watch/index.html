<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0907">
  <title>امتحان مجازی ساعت و دستبند</title>

  <!-- SHARED VTO DESIGN SYSTEM (tokens first — vto-ui.css consumes them) -->
  <link rel="stylesheet" href="../shared/vto-tokens.css">
  <link rel="stylesheet" href="../shared/vto-ui.css">

  <!-- Pinned deliberately: the MediaPipe wasm fileset loaded in
       shared/vto-core/MediaPipeTracker.js must match this bundle's version. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body class="vto-app" data-category="watch" data-camera-switch="true" data-back-url="/store">
  <!-- Live camera feed — this is what the user sees. -->
  <video id="videoElement" autoplay playsinline muted></video>

  <!-- Transparent overlay for the landmark debug drawing. -->
  <canvas id="canvasElement"></canvas>

  <!-- Three.js 3D rendering. -->
  <canvas id="VTOCanvas"></canvas>

  <!--
    In the markup rather than injected by vto-ui.js, so it paints on the first
    frame instead of after the MediaPipe bundle has downloaded.
  -->
  <div class="vto-boot" id="vto-boot">
    <div class="vto-boot-mark">
      <svg class="vto-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13M12 8.8V12l2.2 1.3M8.8 6L9.3 2.5h5.4L15.2 6M8.8 18l.5 3.5h5.4l.5-3.5"/></svg>
    </div>
    <p class="vto-boot-title">در حال آماده‌سازی دوربین…</p>
    <p class="vto-boot-tip">لطفاً اجازه دسترسی به دوربین را تأیید کنید</p>
  </div>

  <div id="techBadge">
    WRIST VTO<br>
    MediaPipe + Three.js
  </div>

  <!-- Shared chrome. Must precede the module: an ES module runs after parsing
       but before DOMContentLoaded, and bootstrap.js expects window.vtoUI. -->
  <script src="../shared/vto-ui.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
