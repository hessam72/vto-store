<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان انگشتر - Hybrid (MediaPipe + WebARRocks Logic)</title>

  <!-- Import Maps for Three.js and MediaPipe -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs"
    }
  }
  </script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
    }

    #videoElement {
      display: none;
    }

    #canvasElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #VTOCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: white;
      font-size: 20px;
      transition: opacity 0.5s;
    }

    #instructions {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      z-index: 50;
      max-width: 400px;
      transition: opacity 0.5s;
    }

    #instructions h2 {
      margin-top: 0;
      color: #ffd700;
    }

    #changeCamera {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      padding: 15px 25px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 16px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    #changeCamera:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    #techBadge {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      color: #00ff00;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      border: 1px solid #00ff00;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Hidden video element for webcam -->
  <video id="videoElement" autoplay playsinline></video>

  <!-- Canvas for video + MediaPipe visualization -->
  <canvas id="canvasElement"></canvas>

  <!-- Canvas for Three.js 3D rendering -->
  <canvas id="VTOCanvas"></canvas>

  <!-- Loading screen -->
  <div id="loading">
    <div>
      <div class="spinner"></div>
      <p>در حال بارگذاری...</p>
      <p style="font-size: 14px; opacity: 0.7;">Hybrid: MediaPipe + WebARRocks Logic</p>
    </div>
  </div>

  <!-- Instructions -->
  <div id="instructions">
    <h2>💍 راهنمای استفاده</h2>
    <p>دست خود را در مقابل دوربین قرار دهید</p>
    <p>انگشتر روی انگشت حلقه شما نمایش داده می‌شود</p>
    <p style="font-size: 14px; opacity: 0.8; margin-top: 15px;">
      این نسخه از هوش مصنوعی MediaPipe برای تشخیص دست و منطق WebARRocks برای جایگذاری انگشتر استفاده می‌کند
    </p>
  </div>

  <!-- Camera switch button -->
  <button id="changeCamera">🔄 تغییر دوربین</button>

  <!-- Technology badge -->
  <div id="techBadge">
    HYBRID MODE<br>
    MediaPipe + WebARRocks
  </div>

  <!-- Main application (ES Module) -->
  <script type="module" src="./main.js"></script>
</body>
</html>
